<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.name }}</title>

    {% include meta.html %}

  <!-- CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=DM+Serif+Display:ital@0;1&family=DM+Serif+Text:ital@0;1&display=swap" rel="stylesheet">
  <style>
    /* Site fonts. Defined after poole.css/hyde.css (loaded in meta.html) so they win. */
    :root {
      --font-serif: "DM Serif Display", Georgia, serif;
      --font-serif-text: "DM Serif Text", Georgia, serif; /* For serif body copy; unused by default. */
      --font-sans: "DM Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --font-mono: "DM Mono", Menlo, Monaco, monospace;
    }
    html, body, .pagination { font-family: var(--font-sans); }
    h1, h2, h3, h4, h5, h6, .sidebar-about h1 {
      font-family: var(--font-serif);
      font-weight: 400; /* DM Serif Display ships one weight; avoid faux bold. */
    }
    .serif-text { font-family: var(--font-serif-text); }
    code, kbd, pre, samp, .highlight pre, .gist .gist-file { font-family: var(--font-mono) !important; }
    @media (max-width: 47.99em) {
      .sidebar-about img { width: 120px; height: 120px; object-fit: cover; margin: 0 auto 1rem; }
    }
    .blog-list { list-style: none; padding-left: 0; margin-top: 0.25rem; }
    .blog-list li { display: flex; gap: 1rem; margin-bottom: 0.35rem; }
    .blog-date { flex: 0 0 3.75rem; color: #9a9a9a; font-variant-numeric: tabular-nums; }
    /* Publications */
    .pub { margin-bottom: 1.1rem; }
    .pub-title { color: #222; font-weight: 600; text-decoration: none; }
    .pub-title:hover { color: #a41034; text-decoration: underline; }
    .pub-meta { font-size: 0.85rem; color: #666; margin-top: 0.15rem; }
    .pub-meta strong { color: #222; }
    .pub-tldr { font-size: 0.85rem; color: #444; margin-top: 0.2rem; }
    .pub-note { font-weight: 600; color: #a41034; }
    .pub-note::before { content: "· "; color: #999; font-weight: 400; }
    /* Sidebar */
    .sidebar .lead { color: rgba(255,255,255,.85); }
    .sidebar-links { display: flex; flex-wrap: wrap; gap: 0.25rem 0.9rem; font-size: 0.9rem; }
    .page a { color: inherit; text-decoration: underline; text-decoration-color: rgba(164,16,52,.35); text-underline-offset: 2px; }
    .page a:hover { color: #a41034; text-decoration-color: currentColor; }
    .pub-year-block { display: grid; grid-template-columns: 3.5rem 1fr; column-gap: 1.25rem; margin-bottom: 0.75rem; }
    .pub-year { font-family: var(--font-serif); font-size: 1.35rem; color: #b5b5b5; line-height: 1.5; }
    .pub-list { margin: 0; padding-left: 1.75rem; }
    /* Wide screens: center the text column in the space beside the sidebar */
    @media (min-width: 64em) {
      .content { margin-left: max(22rem, calc(18rem + (100vw - 18rem - 38rem) / 2)); }
    }
    /* Very wide screens: scale everything up a step so the page fills the space */
    @media (min-width: 100em) {
      html { font-size: 22px; }
    }
    /* Sidebar: anchor the photo and name near the top instead of the bottom */
    @media (min-width: 48em) {
      .sidebar-sticky { top: 3rem; bottom: auto; }
    }

      @media (max-width: 38em) { .pub-year-block { grid-template-columns: 1fr; } }    </style>

  {% if page.title %}
    <meta content="{{ site.title }} - {{ site.description }}" property="og:site_name">
    <meta content="{{ page.title }}" property="og:title">
  {% else %}
    <meta content="{{ site.title }}" property="og:site_name">
    <meta content="{{ site.title }}" property="og:title">
  {% endif %}
  {% if page.excerpt %}
    <meta content="{{ page.excerpt | strip_html }}" property="og:description">
  {% else %}
    <meta content="{{ site.description }}" property="og:description">
  {% endif %}


    {% include favicon.html %}

    {% feed_meta %}

  </head>

  <body>
    
    {% include sidebar.html %}

    <div id="main" role="main" class="content container">
      {{ content }}
    </div>

    <div class="wrapper-footer">
      <div class="container">
        <footer class="footer">
          {% include svg-icons.html %}
        </footer>
      </div>
    </div>

    <script type="text/javascript" async
        src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.2/MathJax.js?config=TeX-AMS_CHTML">
    </script>
    <script>
            MathJax.Hub.Config({
                config: ["MMLorHTML.js"],
                extensions: ["tex2jax.js","TeX/AMSmath.js","TeX/AMSsymbols.js"],
                jax: ["input/TeX"],
                tex2jax: {
                    inlineMath: [ ['$','$'], ["\\(","\\)"] ],
                    displayMath: [ ['$$','$$'], ["\\[","\\]"] ],
                    processEscapes: true
                },
                TeX: {
                    TagSide: "right",
                    TagIndent: ".8em",
                    MultLineWidth: "85%",
                    equationNumbers: {
                       autoNumber: "AMS",
                    },
                    unicode: {
                       fonts: "STIXGeneral,'Arial Unicode MS'"
                    }
                },
                showProcessingMessages: false
            });
    </script>
    {% include analytics.html %}
  </body>
</html>
